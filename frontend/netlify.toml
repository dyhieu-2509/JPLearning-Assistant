[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "http://14.225.217.109:8084/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth2/*"
  to = "http://14.225.217.109:8084/oauth2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login/oauth2/*"
  to = "http://14.225.217.109:8084/login/oauth2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

services:
  backend:
    build:
      context: ./backend
    container_name: jpassistant-backend
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jpassistant}
      POSTGRES_USER: ${POSTGRES_USER:-jpassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jpassistant123}
      SPRING_NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpassword}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-45s}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-bytes-minimum-for-hs256}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-8m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-14d}
      FRONTEND_AUTH_REDIRECT_URL: ${FRONTEND_AUTH_REDIRECT_URL:-http://localhost:3000/auth/callback}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:-}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:-}
    depends_on:
      - postgres
      - neo4j
      - ai-service
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    container_name: jpassistant-ai-service
    expose:
      - "8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpassword}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jp_learning_knowledge}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-384}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      - neo4j
      - qdrant
    volumes:
      - ./datasets:/datasets:ro
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: jpassistant-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jpassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jpassistant123}
      POSTGRES_DB: ${POSTGRES_DB:-jpassistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: jpassistant-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: jpassistant-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
